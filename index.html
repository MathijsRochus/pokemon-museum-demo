<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museumdex — Design Museum Gent</title>

    <!-- Load Phaser 3 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>

    <!-- The string table is fetched by boot.js, which cannot run until every
         script above it has parsed — measured on Pages, that put the request at
         447ms when the scripts finished at 446ms, making it purely serial. The
         preload starts it alongside them instead. -->
    <link rel="preload" href="content/nl.json?v=8" as="fetch" crossorigin="anonymous">

    <!-- Retro display face, with a monospace fallback if it doesn't load -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #20242c;
            --paper: #f7f3e8;
            --accent: #e74c3c;
            --gold: #f5c451;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 0%, #24242e 0%, #101014 70%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            font-family: 'Press Start 2P', 'Courier New', Courier, monospace;
            color: #cfcadb;
        }

        h1 {
            font-size: 16px;
            letter-spacing: 2px;
            margin: 0;
            color: var(--gold);
            text-shadow: 2px 2px 0 #000;
        }

        /* --- The game window --- */
        #game-container {
            position: relative;
            width: min(960px, 94vw);
            aspect-ratio: 3 / 2;   /* matches the 480x320 canvas */
            background: #1a1a20;
            border: 4px solid #3a3a48;
            border-radius: 10px;
            box-shadow: 0 0 0 4px #000, 0 18px 40px rgba(0,0,0,0.75);
            overflow: hidden;
        }

        #game-container canvas { display: block; }

        /* --- HUD --- */
        #hud {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(20, 20, 28, 0.85);
            border: 2px solid #55556a;
            border-radius: 6px;
            font-size: 11px;
            z-index: 5;
            pointer-events: none;
        }

        #hud .dot { color: var(--gold); }

        /* The counter sits hard right of the wing name, so the HUD stays two
           rows tall — a third row pushed the AUTO button under the toast. */
        #progress-counter { color: #fff; margin-left: auto; padding-left: 10px; }

        #hud {
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            pointer-events: auto;   /* the slider needs to be clickable */
        }

        .hud-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .danger-label { color: #d2789b; }

        #threat-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 110px;
            height: 8px;
            border: 2px solid #55556a;
            border-radius: 4px;
            background: #2b2b38;
            cursor: pointer;
            outline: none;
        }

        #threat-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 16px;
            background: #f0eef6;
            border: 2px solid #16161e;
            border-radius: 2px;
            cursor: pointer;
        }

        #threat-slider::-moz-range-thumb {
            width: 10px;
            height: 16px;
            background: #f0eef6;
            border: 2px solid #16161e;
            border-radius: 2px;
            cursor: pointer;
        }

        #threat-label { color: #fff; min-width: 34px; }

        #threat-auto {
            font-family: inherit;
            font-size: 7px;
            padding: 4px 6px;
            background: #2b2b38;
            color: #8f89a0;
            border: 2px solid #55556a;
            border-radius: 4px;
            cursor: pointer;
        }

        #threat-auto.manual {
            background: var(--gold);
            color: var(--ink);
            border-color: var(--ink);
        }

        /* --- Game over --- */
        #gameover-screen {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(12, 8, 16, 0.94);
            z-index: 30;
            align-items: flex-start;
            justify-content: center;
            padding: 24px;
            overflow-y: auto;   /* the gallery below can run long */
        }

        .go-panel {
            text-align: center;
            max-width: 560px;
            margin: auto;
        }

        .go-title {
            font-size: 26px;
            letter-spacing: 5px;
            color: #e0457b;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 14px;
        }

        .go-sub {
            font-size: 9px;
            line-height: 1.9;
            color: #b9b2c6;
            margin-bottom: 22px;
        }

        .go-stats {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px 16px;
            font-size: 9px;
            color: #8f89a0;
            text-align: left;
            background: #211a28;
            border: 2px solid #4a3b55;
            border-radius: 6px;
            padding: 14px 16px;
            margin-bottom: 22px;
        }

        .go-stats b { color: #fff; }

        #go-retry {
            font-family: inherit;
            font-size: 11px;
            padding: 14px 22px;
            background: var(--accent);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 0 #8e2f24;
        }
        #go-retry:active { transform: translateY(2px); box-shadow: 0 1px 0 #8e2f24; }

        #pokedex-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 10px 14px;
            background: var(--accent);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            letter-spacing: 1px;
            box-shadow: 0 3px 0 #8e2f24;
            z-index: 5;
        }
        #pokedex-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #8e2f24; }

        /* --- Retro dialogue box --- */
        #dialogue-box {
            display: none;
            position: absolute;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: var(--paper);
            color: var(--ink);
            border: 4px solid var(--ink);
            border-radius: 10px;
            padding: 18px 20px;
            box-shadow: 0 0 0 4px var(--paper), 6px 6px 0 rgba(0,0,0,0.45);
            z-index: 10;
        }

        #dialogue-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        #exhibit-title {
            margin: 0;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #dialogue-new {
            display: none;
            font-size: 8px;
            padding: 4px 6px;
            background: var(--accent);
            color: #fff;
            border-radius: 4px;
        }

        #exhibit-desc {
            margin: 0;
            font-size: 11px;
            line-height: 1.9;
            min-height: 3.8em;   /* stops the box resizing as text types out */
        }

        #dialogue-hint {
            font-size: 8px;
            color: #8a8375;
            margin-top: 12px;
            text-align: right;
        }

        #dialogue-hint::after {
            content: ' \25BC';
            animation: blink 0.8s steps(1) infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* --- Pokédex overlay --- */
        #pokedex-screen {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(18, 18, 26, 0.96);
            color: #fff;
            padding: 24px;
            z-index: 20;
            overflow-y: auto;
        }

        #pokedex-screen h2 {
            margin: 0 0 4px 0;
            font-size: 15px;
            color: var(--gold);
        }

        #dex-count {
            font-size: 9px;
            color: #9a94a8;
            margin-bottom: 18px;
        }

        .dex-item {
            background: #2a2a36;
            margin-bottom: 12px;
            padding: 14px;
            border-radius: 6px;
            border-left: 5px solid var(--accent);
        }

        .dex-item.locked {
            border-left-color: #55556a;
            opacity: 0.55;
        }

        .dex-num  { font-size: 8px; color: #8f89a0; margin-bottom: 6px; }
        .dex-name { font-size: 12px; margin-bottom: 8px; line-height: 1.5; }
        .dex-desc { font-size: 9px; line-height: 1.9; color: #c6c1d4; }

        /* The photograph sits beside the text, and drops under it when the
           window is too narrow to hold both. */
        .dex-body {
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .dex-text { min-width: 0; }   /* lets long labels wrap instead of pushing out */

        .dex-photo {
            width: 96px;
            flex: 0 0 96px;
            aspect-ratio: 1;
            object-fit: contain;
            background: #1c1c25;
            border: 2px solid #45455a;
            border-radius: 4px;
        }

        @media (max-width: 620px) {
            .dex-body { flex-direction: column; }
            .dex-photo { width: 120px; flex-basis: auto; }
        }

        /* Catalogue metadata: a label/value grid, one row per field present. */
        .dex-facts {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 4px 10px;
            font-size: 8px;
            line-height: 1.7;
            margin-bottom: 10px;
        }

        .dex-facts span { color: #8f89a0; }
        .dex-facts b { color: #e7e3f0; font-weight: normal; }

        .dex-credit {
            font-size: 7px;
            line-height: 1.8;
            color: #7d7790;
            margin-top: 10px;
        }

        .dex-credit a { color: #9aa6d2; }

        /* Rarity chip. The tier colour is set inline from the tier table in
           game.js, so the two never drift apart. */
        .dex-rarity {
            display: inline-flex;
            align-items: baseline;
            gap: 8px;
            font-size: 8px;
            padding: 5px 8px;
            margin-bottom: 10px;
            border: 2px solid currentColor;
            border-radius: 4px;
            line-height: 1.4;
        }

        .dex-rarity span { color: #8f89a0; font-size: 7px; }

        /* --- Dex footer --- */
        #dex-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }

        #dex-download {
            padding: 12px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            background: #2f5580;
            color: #fff;
            border: 2px solid #6a8fbf;
            border-radius: 6px;
        }

        #dex-download:active { transform: translateY(2px); }

        #dex-download-note {
            font-size: 7px;
            line-height: 1.9;
            color: #7d7790;
            margin-top: 10px;
            max-width: 420px;
        }

        /* --- End-of-run gallery --- */
        #go-gallery-title {
            margin: 30px 0 6px;
            font-size: 11px;
            color: var(--gold);
            letter-spacing: 1px;
        }

        #go-gallery-empty {
            display: none;
            font-size: 8px;
            line-height: 1.9;
            color: #9a94a8;
        }

        #go-gallery {
            display: grid;
            gap: 12px;
            margin-top: 12px;
            text-align: left;
        }

        .go-card {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            background: #211a28;
            border: 2px solid #4a3b55;
            border-radius: 6px;
            padding: 10px;
        }

        /* The frame keeps its space whether or not a photograph arrives, so a
           late one does not shift the whole gallery when it lands. */
        .go-card-frame {
            flex: 0 0 92px;
            width: 92px;
            aspect-ratio: 1;
            background: #16121c;
            border: 2px solid #3b2f45;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Two layers: the drawn object underneath, the photograph over it. The
           drawing is never removed, so a photograph that fails to decode leaves
           the card looking finished rather than broken. */
        .go-card-frame { position: relative; }

        .go-card-frame img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Nearest-neighbour, or the 20px drawing turns to mush at 92px. The
           padding keeps it off the frame edge, the way a plinth would. */
        .go-card-art {
            image-rendering: pixelated;
            padding: 12px;
            box-sizing: border-box;
        }

        .go-card-photo { opacity: 0; transition: opacity 0.35s ease; }

        .go-card-frame.has-photo .go-card-art { opacity: 0; }
        .go-card-frame.has-photo .go-card-photo { opacity: 1; }

        .go-card-body { min-width: 0; }
        .go-card-name { font-size: 10px; line-height: 1.5; margin-bottom: 8px; }
        .go-card-maker { font-size: 8px; color: #9a94a8; margin-bottom: 6px; }

        .go-card-desc {
            font-size: 8px;
            line-height: 1.9;
            color: #c6c1d4;
            max-height: 8.4em;
            overflow-y: auto;
        }

        @media (max-width: 620px) {
            .go-card { flex-direction: column; }
            .go-card-frame { flex-basis: auto; width: 120px; }
        }

        /* Wing heading in the dex, with that wing's tally on the right. */
        .dex-room {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            margin: 18px 0 10px;
            padding-bottom: 6px;
            border-bottom: 2px solid #45455a;
            font-size: 10px;
            color: var(--gold);
        }

        .dex-room:first-child { margin-top: 0; }
        .dex-room b { font-size: 9px; color: #9a94a8; font-weight: normal; }

        #dex-close {
            margin-top: 8px;
            padding: 12px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 10px;
            background: #3a3a48;
            color: #fff;
            border: 2px solid #6a6a80;
            border-radius: 6px;
        }

        /* --- Discovery toast --- */
        #toast {
            position: absolute;
            /* Clear of the HUD: at 60px it sat on top of the AUTO button. */
            top: 88px;
            left: 50%;
            transform: translate(-50%, -12px);
            padding: 12px 18px;
            background: var(--gold);
            color: var(--ink);
            border: 3px solid var(--ink);
            border-radius: 6px;
            font-size: 9px;
            letter-spacing: 1px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 15;
        }

        #toast.visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* --- Boot screen, shown while the collection loads --- */
        #boot-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            background: #16161e;
            color: #cfcadb;
            z-index: 30;
            text-align: center;
            padding: 24px;
        }

        #boot-title {
            font-size: 12px;
            color: var(--gold);
            letter-spacing: 1px;
        }

        #boot-status {
            font-size: 9px;
            color: #9a94a8;
            line-height: 1.8;
        }

        /* The museum's pixel logo is black on transparent, so it needs its own
           white plate to sit on — on the dark screens it would vanish. */
        .logo-plate {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 3px solid var(--ink);
            border-radius: 8px;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
            padding: 12px;
        }

        .logo-plate img {
            display: block;
            width: 96px;
            height: 96px;
            image-rendering: pixelated;
        }

        #boot-screen .logo-plate { margin-bottom: 4px; }

        #gameover-screen .logo-plate {
            margin: 0 auto 18px;
            width: max-content;
        }

        #gameover-screen .logo-plate img { width: 72px; height: 72px; }

        #boot-note {
            font-size: 7px;
            line-height: 2;
            color: #6f6a80;
            max-width: 320px;
        }

        /* Chunky pixel progress bar — no smooth transition, it should step. */
        #boot-track {
            width: min(280px, 70%);
            height: 14px;
            background: #2b2b38;
            border: 3px solid #55556a;
            padding: 2px;
        }

        #boot-bar {
            width: 0%;
            height: 100%;
            background: var(--gold);
            transition: width 0.2s steps(8);
        }

        /* --- Start screen: name, then in you go --- */
        #start-screen {
            position: absolute;
            inset: 0;
            /* Revealed by boot.js once the strings are loaded — the markup has
               no copy of its own, so showing it earlier flashes empty boxes. */
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            background:
                radial-gradient(circle at 50% 30%, #2a2434 0%, #14141b 75%);
            color: #cfcadb;
            z-index: 40;
            text-align: center;
            padding: 28px;
        }

        #start-title {
            font-size: 20px;
            color: var(--gold);
            letter-spacing: 3px;
            text-shadow: 3px 3px 0 #000;
        }

        #start-sub {
            font-size: 8px;
            line-height: 2;
            color: #a49db5;
            max-width: 420px;
        }

        #start-sub b { color: #e0457b; }

        #start-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }

        #start-form label {
            font-size: 9px;
            color: #cfcadb;
        }

        #player-name {
            font-family: inherit;
            font-size: 11px;
            text-align: center;
            padding: 10px 12px;
            width: 220px;
            color: var(--ink);
            background: var(--paper);
            border: 3px solid var(--ink);
            border-radius: 4px;
            outline: none;
        }

        #player-name:focus { box-shadow: 0 0 0 3px var(--gold); }

        #start-button {
            font-family: inherit;
            font-size: 11px;
            padding: 12px 22px;
            cursor: pointer;
            color: #fff;
            background: var(--accent);
            border: 3px solid var(--ink);
            border-radius: 6px;
            box-shadow: 0 4px 0 #8e2f24;
        }

        #start-button:active { transform: translateY(3px); box-shadow: 0 1px 0 #8e2f24; }

        #room-label {
            color: var(--gold);
        }

        #source-note {
            font-size: 8px;
            line-height: 1.9;
            color: #7d7790;
            text-align: center;
            max-width: 640px;
        }

        #source-note a { color: #9aa6d2; }

        /* Shown only when content/<lang>.json could not be read — see
           I18n.showLoadFailure(). Styled inline-ish because at that point no
           copy has loaded and the page has nothing else to say. */
        #strings-failed {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 32px;
            background: #16161e;
            color: #cfcadb;
            text-align: center;
            z-index: 100;
            font-size: 10px;
            line-height: 2;
        }

        #strings-failed h2 { font-size: 14px; color: var(--gold); margin: 0; }
        #strings-failed p { margin: 0; max-width: 460px; }
        #strings-failed code { color: var(--gold); }

        #strings-failed pre {
            margin: 0;
            padding: 12px 16px;
            background: #23232e;
            border: 2px solid #45455a;
            border-radius: 6px;
            color: #fff;
            font-size: 10px;
        }

        #strings-failed .en { color: #7d7790; font-size: 8px; margin-top: 8px; }

        #controls {
            font-size: 9px;
            color: #7a7590;
            line-height: 2;
            text-align: center;
        }
        #controls b { color: var(--gold); }
    </style>
</head>
<body>

    <h1 data-i18n="page.title">Museumdex</h1>

    <div id="game-container">
        <div id="hud">
            <div class="hud-row">
                <span class="dot">&#9679;</span>
                <span id="room-label"></span>
                <span id="progress-counter">0/0</span>
            </div>
            <div class="hud-row" id="danger">
                <span class="danger-label" data-i18n="hud.difficulty"></span>
                <input type="range" id="threat-slider" min="0" max="100" value="0" tabindex="-1">
                <span id="threat-label">0%</span>
                <button id="threat-auto" data-i18n="hud.auto"></button>
            </div>
        </div>

        <button id="pokedex-btn" onclick="togglePokedex()" data-i18n="hud.dexButton"></button>

        <div id="toast"></div>

        <div id="dialogue-box">
            <div id="dialogue-head">
                <h3 id="exhibit-title"></h3>
                <span id="dialogue-new" data-i18n="dialogue.new"></span>
            </div>
            <p id="exhibit-desc"></p>
            <div id="dialogue-hint" data-i18n="dialogue.hint"></div>
        </div>

        <div id="gameover-screen">
            <div class="go-panel">
                <div class="logo-plate">
                    <img src="assets/Pixel-Logo-41-frames-transparent.gif"
                         data-i18n-alt="page.logoAlt" alt="">
                </div>
                <div class="go-title" data-i18n="end.title"></div>
                <div class="go-sub" id="go-sub"></div>
                <div class="go-stats">
                    <span data-i18n="end.statFound"></span><b id="go-found">0/0</b>
                    <span data-i18n="end.statTime"></span><b id="go-time">0:00</b>
                    <span data-i18n="end.statThreat"></span><b id="go-threat">0%</b>
                </div>
                <button id="go-retry" onclick="restartRun()" data-i18n="end.retry"></button>

                <div id="go-gallery-title" data-i18n="end.galleryTitle"></div>
                <div id="go-gallery-empty" data-i18n="end.galleryEmpty"></div>
                <div id="go-gallery"></div>
            </div>
        </div>

        <div id="boot-screen">
            <div class="logo-plate">
                <img src="assets/Pixel-Logo-41-frames-transparent.gif"
                     data-i18n-alt="page.logoAlt" alt="">
            </div>
            <div id="boot-title" data-i18n="loading.title"></div>
            <div id="boot-track"><div id="boot-bar"></div></div>
            <div id="boot-status"></div>
            <div id="boot-note" data-i18n="loading.note"></div>
        </div>

        <div id="start-screen">
            <div id="start-title" data-i18n="start.title"></div>
            <div id="start-sub" data-i18n-html="start.intro"></div>
            <div id="start-form">
                <label for="player-name" data-i18n="start.nameLabel"></label>
                <input type="text" id="player-name" maxlength="14"
                       data-i18n-placeholder="start.namePlaceholder"
                       autocomplete="off" spellcheck="false">
                <button id="start-button" data-i18n="start.button"></button>
            </div>
        </div>

        <div id="pokedex-screen">
            <h2 data-i18n="dex.title"></h2>
            <div id="dex-count"></div>
            <div id="dex-list"></div>
            <div id="dex-actions">
                <button id="dex-close" onclick="togglePokedex()" data-i18n="dex.close"></button>
                <button id="dex-download" onclick="downloadMuseumdex()" data-i18n="dex.download"></button>
            </div>
            <div id="dex-download-note" data-i18n="dex.downloadNote"></div>
        </div>
    </div>

    <div id="source-note"></div>

    <div id="controls">
        <div data-i18n-html="controls.line1"></div>
        <div data-i18n-html="controls.line2"></div>
    </div>

    <!-- The game, as plain scripts in dependency order. No modules and no build
         step: classic scripts share one global scope, so nothing needs exporting,
         and the browser fetches them all in parallel over HTTP/2 rather than
         discovering them one at a time the way `import` would.

         Order matters in two places. Anything evaluated at load time needs what
         it references already defined — the category files register themselves,
         so the registry comes first. And the category ORDER decides which one
         wins when several match, narrowest first, so textile precedes furniture
         and device comes last. boot.js is last because it starts everything.

         The ?v= is a cache buster on all of them at once. GitHub Pages serves
         each file with cache-control: max-age=600, so without it a returning
         visitor inside that window can get a mix of old and new files — worse
         than one stale file, because the halves disagree. Bump them together
         on release:  sed -i '' 's/?v=8/?v=8/g' index.html -->
